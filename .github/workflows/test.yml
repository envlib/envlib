# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python testing

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ main ]

jobs:
  # lint:
  #   name: Lint
  #   runs-on: ubuntu-latest

  #   steps:
  #     - uses: actions/checkout@v4

  #     - name: Install uv
  #       uses: astral-sh/setup-uv@v5
  #       with:
  #         enable-cache: true
  #         cache-dependency-glob: "uv.lock"

  #     - name: Set up Python
  #       run: uv python install 3.10

  #     - name: Install dependencies
  #       run: uv sync

  #     - name: Lint and typecheck
  #       run: |
  #         uv run ruff check .
  #         uv run black --check --diff .
  #         uv run mypy --install-types --non-interactive envlib

  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      # prevent cancelling other jobs if one version fails
      fail-fast: false
      matrix:
        # Define the versions you want to test here
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # 1. Install the specific Python version for this matrix job
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # 2. Sync dependencies
      - name: Install dependencies
        run: uv sync

      # 3. Run tests with coverage
      - name: Run tests
        run: uv run pytest --cov --cov-report=xml

      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  docs:
    name: Docs examples and site build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --python 3.12

      # Offline: blocks that read the live commons are skipped, and any other network use fails.
      - name: Run the docs examples
        timeout-minutes: 10
        run: uv run --python 3.12 pytest README.md docs -p no:cacheprovider -rs

      - name: Build the site (strict)
        run: uv run --python 3.12 mkdocs build --strict

  docs-live:
    # The docs blocks that read the live public commons. Their shown outputs are dated snapshots
    # of the catalogue, so this job also goes red when the commons changes: update the docs then.
    name: Docs examples against the live commons
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --python 3.12

      - name: Run the docs examples, live
        timeout-minutes: 15
        run: uv run --python 3.12 pytest README.md docs --docs-live -p no:cacheprovider -rs
